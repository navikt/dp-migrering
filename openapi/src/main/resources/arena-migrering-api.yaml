openapi: 3.0.3
info:
  title: Arena migrering API
  description: API for migrering av data fra Arena.
  version: 1.0.0
  contact:
    name: "#team-dagpenger"
servers:
  - url: https://dp-migrering.dev-fss-pub.nais.io
    description: dev
#  - url: https://dp-arena.intern.nav.no
#    description: prod
paths:
  /arena/migrering/sak/{sakId}:
    post:
      summary: Initier migrering for en sak
      tags:
        - Arena migrering
      security:
        - azureAd: [ ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartMigreringResponse"
        default:
          description: Feil ved initiering av migrering
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
components:
  schemas:

    StartMigreringResponse:
      type: object
      properties:
        opplysninger:
          type: array
          items:
            $ref: "#/components/schemas/OpplysningResponse"

    OpplysningResponse:
      type: object
      properties:
        navn:
          type: string
        verdi:
          type: string
        gyldigFraOgMed:
          type: string
          format: date
        uuid:
          type: string

    HttpProblem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced
      additionalProperties: true

  securitySchemes:
    azureAd:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bruker [AzureAD](https://docs.nais.io/security/auth/azure-ad) til autentisering. 
        Token må ha `audience` satt til `[cluster].teamdagpenger.dp-migrering`.
        
        For å teste APIet kan du lage et gyldig OBO-token ved å bruke wonderwalled:
        - [dev-fss](https://azure-token-generator.intern.dev.nav.no/api/obo?aud=dev-fss.teamdagpenger.dp-migrering)
