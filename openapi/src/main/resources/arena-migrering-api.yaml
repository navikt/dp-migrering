openapi: 3.0.3
info:
  title: Arena migrering API
  description: API for migrering av data fra Arena.
  version: 1.0.0
  contact:
    name: "#team-dagpenger"
servers:
  - url: https://dp-migrering.intern.dev.nav.no
    description: dev
paths:
  /arena/migrering/{migreringId}/oppdateringer:
    get:
      summary: Strømmer lagrede hendelser for én migrering
      description: |
        Krever saksbehandlergruppe og tilgang til personen i StPeter.
        Hendelser sendes i stigende database-ID med hendelsesnavnet som `event`,
        database-ID som `id` og lagret hendelses-JSON som `data`.
        Uten cursor sendes historikken fra starten. Ved gjenoppkobling sendes bare
        hendelser med ID større enn cursor. `Last-Event-ID` har forrang over `since`.
        Strømmen sender `event: ping` med `data: {}` etter 20 sekunder uten hendelser.
        Etter 15 minutter, eller før token utløper, sendes `event: close` med
        `data: {"reason":"reauth"}`. Klienten må da hente et nytt token og koble til
        med siste mottatte hendelses-ID. Hendelser hentes i puljer på 10, med
        to sekunders pause når det ikke finnes nye hendelser.
        Bruk en SSE-klient som kan sende Authorization-header.
      tags:
        - Arena migrering
      security:
        - azureAd: [ ]
      parameters:
        - name: migreringId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: since
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Hendelsesstrøm. Ping og close har ingen hendelses-ID.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: migrering_startet
                data: {"status":"startet"}
                id: 42

        "400":
          description: Ugyldig migreringId eller cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "401":
          description: Manglende eller ugyldig autentisering
        "403":
          description: Ingen tilgang til personen eller migreringen finnes ikke
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
        "429":
          description: Grensen på 100 samtidige strømmer per applikasjonsinstans er nådd
          headers:
            Retry-After:
              schema:
                type: integer
              description: Antall sekunder før klienten kan prøve igjen
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
  /arena/migrering/sak/{sakId}:
    post:
      summary: Starter migrering av en sak fra Arena
      parameters:
        - name: sakId
          in: path
          required: true
          schema:
            type: string
      tags:
        - Arena migrering
      security:
        - azureAd: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMigreringRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartMigreringResponse"
        default:
          description: Feil ved start av migrering
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
components:
  schemas:
    StartMigreringRequest:
      type: object
      properties:
        migreringsTidspunkt:
          type: string
          format: date
          description: Dato for når migreringen skal kjøres.
        simulering:
          type: boolean
          description: Om migreringen skal kjøres i simuleringsmodus.
          default: false
      required:
        - simulering
        - migreringsTidspunkt

    StartMigreringResponse:
      type: object
      properties:
        sakId:
          type: integer
        migreringId:
          type: string
          format: uuid
        simulering:
          type: boolean
          description: Om migreringen skal kjøres i simuleringsmodus.
          default: false
        initiertAv:
          type: string
        ident:
          description: Fødselsnummer eller D-nummer til en person. Må være 11 siffer.
          type: string
          pattern: "^[0-9]{11}$"
        migreringsTidspunkt:
          type: string
          format: date-time
      required:
        - sakId
        - migreringId
        - initiertAv
        - ident
        - simulering

    HttpProblem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced
      additionalProperties: true

  securitySchemes:
    azureAd:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bruker [AzureAD](https://docs.nais.io/security/auth/azure-ad) til autentisering. 
        Token må ha `audience` satt til `[cluster].teamdagpenger.dp-migrering`.
        
        For å teste APIet kan du lage et gyldig OBO-token ved å bruke wonderwalled:
        - [dev-gcp](https://azure-token-generator.intern.dev.nav.no/api/obo?aud=dev-gcp.teamdagpenger.dp-migrering)
