openapi: 3.0.3
info:
  title: Arena migrering API
  description: API for migrering av data fra Arena.
  version: 1.0.0
  contact:
    name: "#team-dagpenger"
servers:
  - url: https://dp-migrering.dev-fss-pub.nais.io
    description: dev
#  - url: https://dp-arena.intern.nav.no
#    description: prod
paths:
  /arena/migrering/sak/{sakId}:
    get:
      summary: Henter datagrunnlag for migrering av en sak fra Arena
      parameters:
        - name: sakId
          in: path
          required: true
          schema:
            type: string
      tags:
        - Arena migrering
      security:
        - azureAd: [ ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigreringGrunnlag"
        default:
          description: Feil ved henting av datagrunnlag for migrering
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
    post:
      summary: Starter migrering av en sak fra Arena
      parameters:
        - name: sakId
          in: path
          required: true
          schema:
            type: string
      tags:
        - Arena migrering
      security:
        - azureAd: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMigrering"
      responses:
        "202":
          description: Accepted
        default:
          description: Feil ved start av migrering
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpProblem"
components:
  schemas:
    Any:
      description: Opplysningens verdi. Typen avhenger av opplysningen.
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: integer

    MigreringGrunnlag:
      type: object
      properties:
        sakId:
          type: integer
        migreringId:
          type: string
          format: uuid
        initiertAv:
          type: string
        ident:
          description: Fødselsnummer eller D-nummer til en person. Må være 11 siffer.
          type: string
          pattern: "^[0-9]{11}$"
        innvilgetFraOgMed:
          type: string
          format: date
        innvilgetTilOgMed:
          type: string
          format: date
        opplysninger:
          type: array
          items:
            $ref: "#/components/schemas/MigreringGrunnlagOpplysning"
      required:
        - sakId
        - migreringId
        - initiertAv
        - ident
        - innvilgetFraOgMed
        - opplysninger

    MigreringGrunnlagOpplysning:
      type: object
      properties:
        navn:
          type: string
        verdi:
          $ref: "#/components/schemas/MigreringGrunnlagOpplysningVerdi"
        gyldigFraOgMed:
          type: string
          format: date
        uuid:
          type: string
          format: uuid
      required:
        - navn
        - uuid

    MigreringGrunnlagOpplysningVerdi:
      type: object
      properties:
        verdi:
          $ref: "#/components/schemas/Any"
        type:
          type: string
          enum:
            - date
            - string
            - integer
            - float
            - boolean
      required:
        - type


    StartMigrering:
      type: object
      properties:
        sakId:
          type: integer
        migreringId:
          type: string
          format: uuid
        initiertAv:
          type: string
        ident:
          description: Fødselsnummer eller D-nummer til en person. Må være 11 siffer.
          type: string
          pattern: "^[0-9]{11}$"
        innvilgetFraOgMed:
          type: string
          format: date
        innvilgetTilOgMed:
          type: string
          format: date
        opplysninger:
          type: array
          items:
            $ref: "#/components/schemas/StartMigreringOpplysning"
      required:
        - sakId
        - migreringId
        - initiertAv
        - ident
        - innvilgetFraOgMed
        - opplysninger

    StartMigreringOpplysning:
      type: object
      properties:
        verdi:
          $ref: "#/components/schemas/Any"
        gyldigFraOgMed:
          type: string
          format: date
        uuid:
          type: string
          format: uuid
      required:
        - verdi
        - gyldigFraOgMed
        - uuid

    HttpProblem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced
      additionalProperties: true

  securitySchemes:
    azureAd:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bruker [AzureAD](https://docs.nais.io/security/auth/azure-ad) til autentisering. 
        Token må ha `audience` satt til `[cluster].teamdagpenger.dp-migrering`.
        
        For å teste APIet kan du lage et gyldig OBO-token ved å bruke wonderwalled:
        - [dev-fss](https://azure-token-generator.intern.dev.nav.no/api/obo?aud=dev-fss.teamdagpenger.dp-migrering)
