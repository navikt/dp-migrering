apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: dp-migrering
  namespace: teamdagpenger
  labels:
    team: teamdagpenger
    subteam: bjoa
spec:
  image: "{{ image }}"
  port: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  startup:
    path: /isalive
    initialDelay: 10
    failureThreshold: 6
    periodSeconds: 5
    timeout: 5
  liveness:
    path: /isalive
    failureThreshold: 6
    periodSeconds: 10
  readiness:
    path: /isready
    failureThreshold: 3
    periodSeconds: 10
  prometheus:
    enabled: true
    path: /metrics
  replicas:
    min: 2
    max: 2
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 768Mi
  env:
    - name: JDK_JAVA_OPTIONS
      value: -XX:+UseParallelGC -XX:MaxRAMPercentage=50.0 -XX:ActiveProcessorCount=4
    - name: GRUPPER_SAKSBEHANDLER
      value: "{{azure.grupper.saksbehandler}}"
    - name: STPETER_URL
      value: "{{stpeter.url}}"
    - name: STPETER_SCOPE
      value: "{{stpeter.scope}}"
    - name: DB_USERNAME_PATH
      value: "/secrets/dbcreds/username"
    - name: DB_PASSWORD_PATH
      value: "/secrets/dbcreds/password"
    - name: DB_JDBC_URL_PATH
      value: "/secrets/dbconfig/jdbc_url"
  envFrom:
    - secret: dp-migrering-unleash-api-token
  kafka:
    pool: "{{ kafka.pool }}"
  vault:
    enabled: true
    paths:
      - kvPath: "{{ vault_db_config_path }}"
        mountPath: /secrets/dbconfig
      - kvPath: "{{ vault_db_creds_path }}"
        mountPath: /secrets/dbcreds
  {{#if ingresses}}
  ingresses:
    {{#each ingresses as |url|}}
    - {{url}}
    {{/each}}
  {{/if}}
  azure:
    application:
      enabled: true
      tenant: "{{azure.tenant}}"
      claims:
        groups:
          - id: "{{azure.grupper.saksbehandler}}"
#  gcp:
#    sqlInstances:
#      - type: POSTGRES_18
#        highAvailability: true
#        diskAutoresize: true
#        pointInTimeRecovery: true
#        retainedBackups: {{gcp.sql.retainedBackups}}
#        tier: "{{gcp.sql.tier}}"
#        flags:
#          - name: cloudsql.enable_pgaudit
#            value: "true"
#          - name: pgaudit.log
#            value: "write,ddl,role"
#          - name: pgaudit.log_parameter
#            value: "on"
#          - name: pgaudit.log_relation
#            value: "on"
#        databases:
#          - name: migrering
#            envVarPrefix: DB

  observability:
    logging:
      destinations:
        - id: loki
        - id: elastic
    autoInstrumentation:
      enabled: true
      runtime: java

  accessPolicy:
    outbound:
      external:
        - host: teamdagpenger-unleash-api.nav.cloud.nais.io
      rules:
        - application: logging
          namespace: nais-system
    inbound:
      rules:
        - application: dp-arena-innsyn-klient
          cluster: "{{environment}}-gcp"
          namespace: teamdagpenger
        {{#if wonderwalled}}
#        - application: wonderwalled-azure
#          namespace: nais
        - application: azure-token-generator
          namespace: nais
          cluster: dev-gcp
        {{/if}}